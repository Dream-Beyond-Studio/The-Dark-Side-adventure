<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>The Dark Side - Adventure</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div id="loginOverlay">
        <div class="loginBox">
            <h1>The Dark Side</h1>
            <input type="text" id="nickInput" placeholder="Enter Nickname" maxlength="15" autocomplete="off">
            <input type="text" id="serverInput" placeholder="Server IP (np. http://localhost:3000)" autocomplete="off">
            
            <div id="classSelection" style="margin: 20px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
                <button class="classBtn selected" data-class="soldier" style="background: #444; color: white; border: 2px solid #32CD32; padding: 10px; cursor: pointer; width: 45%;">Soldier</button>
                <button class="classBtn" data-class="scientist" style="background: #333; color: white; border: 2px solid #555; padding: 10px; cursor: pointer; width: 45%;">Scientist</button>
                <button class="classBtn" data-class="engineer" style="background: #333; color: white; border: 2px solid #555; padding: 10px; cursor: pointer; width: 45%;">Engineer</button>
                <button class="classBtn" data-class="scout" style="background: #333; color: white; border: 2px solid #555; padding: 10px; cursor: pointer; width: 45%;">Scout</button>
            </div>
            
            <button id="playBtn">PLAY</button>
        </div>
    </div>
    <div id="craftingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 900;">
        <div style="background: #222; padding: 30px; border: 4px solid #555; width: 450px; color: white; font-family: Arial, sans-serif; text-align: center;">
            <h2>CRAFTING</h2>
            <div id="recipeList"></div>
            <p style="font-size: 12px; color: #aaa; margin-top: 20px;">Naciśnij [E] aby wyjść</p>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <div id="chat-ui">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Naciśnij Enter aby pisać...">
    </div>
    
    <a href="/docs" target="_blank" class="docs-btn">📘 Dokumentacja</a>

    <script src="/assets/socket.io.min.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
